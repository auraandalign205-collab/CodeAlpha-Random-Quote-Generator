<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quote-container-card">
        <div class="quote-icon-mark">“</div>
        <p id="quote-text-output">Loading inspirational quote engine...</p>
        <h3 id="quote-author-output">- Loading Author</h3>
        
        <!-- BUTTON CONTROL INTERFACE PACK -->
        <div class="navigation-controls">
            <button id="prev-quote-btn" class="nav-btn">← Previous</button>
            <button id="trigger-next-quote-btn" class="main-btn">New Quote</button>
            <button id="next-quote-btn" class="nav-btn">Next →</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
